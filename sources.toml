# One [[source]] block per page to convert into an RSS feed.
# The feed is written to feeds/<id>.xml.

[[source]]
id = "tokens-studio"
name = "Tokens Studio Blog"
url = "https://tokens.studio/blog"
enabled = true
needs_js = false

[source.selectors]
item = 'a[href^="./blog/"]'   # each article card (the card is itself the link)
title = "h2"
# link = "a"                  # optional: element holding the href; if absent, use the item itself
# date, summary: optional, not available on this page

[[source]]
id = "interaction-design-foundation"
name = "Interaction Design Foundation – Literature"
url = "https://ixdf.org/literature"   # interaction-design.org now redirects here
enabled = true
needs_js = false

[source.selectors]
item = "article.js-article-card"   # "js-" class: hook for the site's JS, more stable than Tailwind classes
title = "h2"
link = "a"
date = "time"        # optional: reads the datetime attribute, or the text if there is none
summary = "p"        # optional

[[source]]
id = "dribbble-stories"
name = "Dribbble Stories"
url = "https://dribbble.com/stories"
enabled = true
needs_js = false

[source.selectors]
item = "div.post"
title = "h2"
link = "h2 a"                # the card has two identical links (title and image)
date = "p.date"              # "Oct 9, 2026"
summary = "p:not(.date)"     # a plain "p" would match the date first

[[source]]
id = "figma-forum"
name = "Figma Forum – Product updates"
url = "https://forum.figma.com/product-updates-3"
enabled = true
needs_js = false

[source.selectors]
item = "div.qa-topic-block"             # "qa-" classes are test hooks, rarely renamed
title = ".thread-list-block__title-link"
link = "a.qa-topic-title"               # a plain "a" would match the author's profile link first
summary = "p.thread-list-block__content"
# no date: the only <time> is the date of the last reply, not the publication date

[[source]]
id = "laws-of-ux"
name = "Laws of UX"
url = "https://lawsofux.com/"
enabled = true
needs_js = false

[source.selectors]
item = "article.card"
title = "h2"
link = "h2 a"
summary = "p.card__desc"
# no date on this page; laws are listed alphabetically

[[source]]
id = "figma-config"
name = "Figma Config"
url = "https://config.figma.com/"
# Disabled: the home page is a landing page with 1-2 event links, not a list of articles,
# and its classes are auto-generated. Config announcements already come through figma-forum.
enabled = false
needs_js = false

[source.selectors]
# Untested sketch, kept in case the source is re-enabled (titles would include the "→" arrow).
item = 'nav[aria-label="Event access"] li'
title = ".btn-text"
link = "a"
summary = "p"
